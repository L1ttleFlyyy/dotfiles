set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.local/share/tmux/plugins'

if 'test ! -d "${TMUX_PLUGIN_MANAGER_PATH}/tpm"' {
  run 'mkdir -p "${TMUX_PLUGIN_MANAGER_PATH}"'
  run 'git clone https://github.com/tmux-plugins/tpm "${TMUX_PLUGIN_MANAGER_PATH}/tpm"'
  run '${TMUX_PLUGIN_MANAGER_PATH}/tpm/bin/install_plugins'
}

run-shell 'tmux set-option -g default-shell "$(command -v zsh)"'

set -g prefix2 M-a
set -g mouse on
bind-key    -T copy-mode    C-w               send-keys -X copy-selection-and-cancel
bind-key    -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key    -T copy-mode    M-w               send-keys -X copy-selection-and-cancel
bind-key    -T copy-mode-vi C-j               send-keys -X copy-selection-and-cancel
bind-key    -T copy-mode-vi Enter             send-keys -X copy-selection-and-cancel
bind-key    -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
set-window-option -g mode-keys vi
# set new panes in current directory
bind c   new-window      -c "#{pane_current_path}"
bind '"' split-window    -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"
bind |   split-window -h -c "#{pane_current_path}"
bind -   split-window -v -c "#{pane_current_path}"

# Window/pane indexing: start at 1, auto-renumber on close
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Browser-tab-style navigation (requires extended-keys, set below).
# Mnemonic: arrows = navigate context, hjkl = manipulate current pane.
bind -n C-M-Left  previous-window
bind -n C-M-Right next-window
bind -n C-M-Up    switch-client -p
bind -n C-M-Down  switch-client -n

# Jump directly to window N
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9

# Frequent window/pane actions
bind -n M-t  new-window      -c "#{pane_current_path}"
bind -n M-\\ split-window -h -c "#{pane_current_path}"
bind -n M--  split-window -v -c "#{pane_current_path}"
bind -n M-d  detach-client
# Toggle a global "scratch" session. Avoids display-popup because popup panes
# have wp == NULL, which causes tmux's input_osc_52() to drop OSC52 clipboard
# sequences — breaking copy inside the popup. See tmux-users mailing list.
bind -n M-g if-shell -F '#{==:#{session_name},scratch}' {
    switch-client -l
} {
    new-session -A -d -s scratch -c "#{pane_current_path}"
    switch-client -t scratch
}

# Vim-style pane navigation and resizing
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n C-M-h resize-pane -L 1
bind -n C-M-j resize-pane -D 1
bind -n C-M-k resize-pane -U 1
bind -n C-M-l resize-pane -R 1

# Conditional setting for default-terminal
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Terminal capabilities. Reset first so repeated source-file calls do not
# append duplicate feature entries.
set -su terminal-features
set -as terminal-features 'xterm-256color:RGB'

# Enable xterm-keys for better key handling
set -g xterm-keys on

# Enable extended keys (CSI u) so Shift-Enter / Ctrl-Enter / Ctrl-/ etc.
# can reach apps running inside tmux. Requires outer terminal support
# (kitty, WezTerm, Ghostty, foot, modern xterm, iTerm2 3.5+, ...).
set -s extended-keys on
set -as terminal-features '*:extkeys'

# Enable bracketed paste mode for all terminals
set -as terminal-features '*:bpaste'

# Clipboard integration
set -s set-clipboard on

# Allow OSC passthrough for terminal queries
set -g allow-passthrough on

# Drop the old statefile polling segment if this server had sourced it before.
set -gu @theme_poll

# tmux 3.6+ tracks the outer terminal's light/dark theme per client. Keep the
# current theme inside this tmux server so separate tmux servers do not fight
# through a shared statefile.
#
# The `if -F` test and the `set` that follows run back to back in tmux's single
# command queue, so this is an atomic test-and-set: overlapping hooks can never
# both observe the stale value and both kick off a re-source. The re-source is
# expensive (it re-runs tpm), so it must fire only on a real theme flip.
#
# There is deliberately no client-active hook. The light/dark notification is
# pushed by the terminal (DEC mode 2031) whenever the OS theme flips, whether or
# not the terminal is focused, so focus changes carry no new information — they
# only produce bursts of concurrent re-sources. A client that was gone during a
# flip is caught by client-attached.
set-hook -g client-light-theme 'if -F "#{!=:#{@client_theme_current},light}" {
    set -g @client_theme_current light
    run-shell -b "bash ~/.config/tmux/tmux-client-theme.sh light"
}'
set-hook -g client-dark-theme 'if -F "#{!=:#{@client_theme_current},dark}" {
    set -g @client_theme_current dark
    run-shell -b "bash ~/.config/tmux/tmux-client-theme.sh dark"
}'
set-hook -g client-attached 'if -F "#{&&:#{!=:#{client_theme},},#{!=:#{client_theme},#{@client_theme_current}}}" {
    set -gF @client_theme_current "#{client_theme}"
    run-shell -b "bash ~/.config/tmux/tmux-client-theme.sh #{client_theme}"
}'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Keep vim-tmux-navigator on the Alt-leading layer; leave Ctrl-hjkl for resize.
set -g @vim_navigator_mapping_left  'M-h'
set -g @vim_navigator_mapping_down  'M-j'
set -g @vim_navigator_mapping_up    'M-k'
set -g @vim_navigator_mapping_right 'M-l'
set -g @vim_navigator_mapping_prev  'M-p'
set -g @plugin 'christoomey/vim-tmux-navigator'
# prettify
# set -g @plugin 'joshmedeski/tmux-nerd-font-window-name' # interesting plugin, but needs more polish to work with window rename
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'l1ttleflyyy/tmux' # See https://github.com/catppuccin/tmux

#set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Configure the catppuccin plugin

# Set the flavor and pane background from server-local client theme state.
if -F '#{==:#{@client_theme_current},}' {
    set -gF @client_theme_current "#{?#{==:#{client_theme},light},light,dark}"
}
if -F '#{==:#{@client_theme_current},light}' {
    set -g @catppuccin_flavor "gruvbox"
} {
    set -g @catppuccin_flavor "macchiato"
}

# Let panes inherit the outer terminal background instead of painting a fixed
# catppuccin/gruvbox color. This way nvim (transparent) and shell blank space
# both fall through to whatever colorscheme the host terminal (VSCode, Codex,
# ...) is using, avoiding the seam when host theme != catppuccin/gruvbox.
# Set explicitly (not unset) so re-sourcing this file resets a running server.
set -g window-style "bg=default"
set -g window-active-style "bg=default"
set -g @catppuccin_window_text                  " #W"
set -g @catppuccin_window_number                "#I"
set -g @catppuccin_window_number_position       'right'
set -g @catppuccin_window_current_text          " #W"
set -g @catppuccin_window_current_text_color    '#{E:@thm_surface_1}'
set -g @catppuccin_window_current_number        "#I"
# set -g @catppuccin_window_current_number_color  '#{E:@thm_red}'
set -g @catppuccin_window_status_style      "rounded"
# set -g @catppuccin_window_flags             "icon" # none, icon, or text

# set -g @catppuccin_status_left_separator    ""
# set -g @catppuccin_status_right_separator   " "
# set -g @catppuccin_status_connect_separator "no"

set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'
set -g @catppuccin_status_background     'default'

set -g @catppuccin_host_icon             " "
set -g @catppuccin_host_text             " #h"
set -g @catppuccin_host_color            "#{E:@thm_green}"

# Load catppuccin
run '#{TMUX_PLUGIN_MANAGER_PATH}/tmux/catppuccin.tmux'

# status bar frequency
set-option -g status-interval 2

# Make the status line pretty and add some modules
set -g status-right-length  120
set -g status-left-length    80

set -g status-left "#{?#{==:#{session_name},scratch},#[fg=#{@thm_mauve}#,bg=default]#[fg=#{@thm_crust}#,bg=#{@thm_mauve}] SCRATCH #[fg=#{@thm_mauve}#,bg=default] ,}#{E:@catppuccin_status_host}"

set -gF  status-right "#{E:@catppuccin_status_my_cpu}"
set -agF status-right "#{E:@catppuccin_status_my_ram}"
set -agF status-right "#{E:@catppuccin_status_my_disk}"

# Initialize TMUX plugin manager. This is the last line of ordinary config --
# only the plugin-override section below may follow it.
run '#{TMUX_PLUGIN_MANAGER_PATH}/tpm/tpm'

# ---------------------------------------------------------------------------
# Plugin overrides
#
# Everything here undoes an assignment a plugin makes unconditionally while it
# loads, so it MUST stay below the tpm line -- moved any higher it is silently
# clobbered, with no error. tpm sources plugins synchronously (no run-shell -b),
# so these run after every plugin has finished loading.
# ---------------------------------------------------------------------------

# tmux-resurrect destroys the saved cwd of every pane whose #{pane_title} is
# empty: its `IFS=$'\t' read` parser collapses the adjacent tabs and shifts all
# later fields left. Route saves through a wrapper that backfills empty titles
# first -- see ~/.config/tmux/resurrect-save-wrapper.sh for the full writeup.
#
# resurrect.tmux claims both of these on load and neither assignment is
# conditional (`set-option -gq` -- the -q only silences errors, it is not -o):
#
#   resurrect.tmux:12  tmux bind-key "$key" run-shell "$CURRENT_DIR/scripts/save.sh"
#   resurrect.tmux:30  tmux set-option -gq "$save_path_option" ".../save.sh"
#
# continuum re-reads the option on every autosave and execs it directly, with
# no shell to expand a tilde, so it has to hold an absolute path -- hence the
# -F and #{HOME}. The key binding does go through sh, so $HOME is fine there.
set -gF @resurrect-save-script-path '#{HOME}/.config/tmux/resurrect-save-wrapper.sh'
bind C-s run-shell '$HOME/.config/tmux/resurrect-save-wrapper.sh'
