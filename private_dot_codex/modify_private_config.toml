{{- /* chezmoi:modify-template */ -}}
{{- $data := .chezmoi.stdin | fromToml -}}
{{- /* Remove the retired unslop hook while preserving other prompt hooks. */ -}}
{{- $groups := list -}}
{{- range (dig "hooks" "UserPromptSubmit" (list) $data) -}}
{{-   $hooks := list -}}
{{-   range (dig "hooks" (list) .) -}}
{{-     if not (contains ".codex/hooks/inject_unslop.sh" (dig "command" "" .)) -}}
{{-       $hooks = append $hooks . -}}
{{-     end -}}
{{-   end -}}
{{-   if $hooks -}}
{{-     $groups = append $groups (setValueAtPath "hooks" $hooks .) -}}
{{-   end -}}
{{- end -}}
{{- if $groups -}}
{{-   $data = setValueAtPath "hooks.UserPromptSubmit" $groups $data -}}
{{- else -}}
{{-   $_ := unset (dig "hooks" (dict) $data) "UserPromptSubmit" -}}
{{- end }}
{{ $data
  | setValueAtPath "analytics.enabled" false
  | setValueAtPath "approval_policy" "on-request"
  | setValueAtPath "approvals_reviewer" "auto_review"
  | setValueAtPath "features.default_mode_request_user_input" true
  | setValueAtPath "features.memories" false
  | setValueAtPath "memories.generate_memories" false
  | setValueAtPath "memories.use_memories" false
  | setValueAtPath "memories.disable_on_external_context" true
  | setValueAtPath "tui.status_line" (list
      "model-with-reasoning"
      "current-dir"
      "git-branch"
      "branch-changes"
      "context-remaining"
      "five-hour-limit"
      "weekly-limit")
  | setValueAtPath "tui.status_line_use_colors" true
  | toToml }}
